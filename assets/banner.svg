<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#081021" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#34d399;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#38bdf8;#818cf8;#22d3ee" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.04" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura / Background Glows -->
  <g filter="url(#softGlow)">
    <circle cx="200" cy="80" r="140" fill="#0284c7" opacity="0.15">
      <animate attributeName="cx" values="180;240;180" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="70;110;70" dur="12s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="270" r="160" fill="#6366f1" opacity="0.14">
      <animate attributeName="cx" values="1020;960;1020" dur="11s" repeatCount="indefinite" />
      <animate attributeName="cy" values="270;220;270" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.2;0.1" dur="7s" repeatCount="indefinite" />
    </circle>
    <circle cx="620" cy="180" r="180" fill="#0d9488" opacity="0.12">
      <animate attributeName="r" values="160;200;160" dur="8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.08;0.16;0.08" dur="10s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Subtle High-Tech Vector Grid Pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Cyber Data Particles in Background -->
  <g fill="#38bdf8" opacity="0.45">
    <circle cx="85" cy="140" r="2.5">
      <animate attributeName="cy" values="140;110;140" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1110" cy="120" r="3">
      <animate attributeName="cy" values="120;150;120" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="340" cy="45" r="2">
      <animate attributeName="cx" values="340;370;340" dur="7s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="860" cy="320" r="2.5">
      <animate attributeName="cx" values="860;830;860" dur="6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.2;0.7;0.2" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="180" cy="310" r="2">
      <animate attributeName="cy" values="310;285;310" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1040" cy="60" r="2.5">
      <animate attributeName="cy" values="60;85;60" dur="5.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Dynamic Shield Radar Ring / Signal Pulse -->
  <g transform="translate(600, 75)" opacity="0.5">
    <circle cx="0" cy="0" r="26" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
      <animate attributeName="r" values="22;42;22" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- TV Display Icon with Shield Check -->
    <path d="M-10 -7 L10 -7 C11.5 -7 12 -6.5 12 -5 L12 4 C12 5.5 11.5 6 10 6 L-10 6 C-11.5 6 -12 5.5 -12 4 L-12 -5 C-12 -6.5 -11.5 -7 -10 -7 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <path d="M-5 9 L5 9 M0 6 L0 9" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />
    <path d="M-3 -1 L-0.5 1.5 L3.5 -2.5" fill="none" stroke="#4ade80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(600, 126)">
    <rect x="-140" y="-12" width="280" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="0" y="4" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title -->
  <text x="600" y="180" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="url(#titleGrad)">
    Awesome Smart TV Utilities &amp; Ad Blocking
  </text>

  <!-- FOREGROUND CONTENT: Subtitle -->
  <text x="600" y="214" font-size="15" font-weight="400" text-anchor="middle" fill="#94a3b8" letter-spacing="0.2">
    Network-Wide DNS Sinkholes • ADB TV Debloaters • Ad-Free Streaming Clients • Custom Launchers
  </text>

  <!-- Dynamic Feature Badges / Pills in Lower Area -->
  <g transform="translate(145, 260)" filter="url(#pillShadow)">
    <!-- Pill 1: DNS Protection -->
    <g transform="translate(0, 0)">
      <rect width="195" height="42" rx="10" fill="url(#badgeGrad)" stroke="#0284c7" stroke-width="1.2">
        <animate attributeName="stroke" values="#0284c7;#38bdf8;#0284c7" dur="4s" repeatCount="indefinite" />
      </rect>
      <circle cx="22" cy="21" r="5" fill="#38bdf8" />
      <text x="36" y="26" fill="#f1f5f9" font-size="13" font-weight="600">DNS Sinkholes</text>
      <text x="140" y="26" fill="#38bdf8" font-size="11" font-weight="500">Pi-hole / AGH</text>
    </g>

    <!-- Pill 2: ADB Debloating -->
    <g transform="translate(225, 0)">
      <rect width="215" height="42" rx="10" fill="url(#badgeGrad)" stroke="#6366f1" stroke-width="1.2">
        <animate attributeName="stroke" values="#6366f1;#818cf8;#6366f1" dur="4s" repeatCount="indefinite" />
      </rect>
      <circle cx="22" cy="21" r="5" fill="#818cf8" />
      <text x="36" y="26" fill="#f1f5f9" font-size="13" font-weight="600">ADB Debloaters</text>
      <text x="145" y="26" fill="#818cf8" font-size="11" font-weight="500">CleanYourTV / UAD</text>
    </g>

    <!-- Pill 3: Ad-Free Streaming -->
    <g transform="translate(470, 0)">
      <rect width="210" height="42" rx="10" fill="url(#badgeGrad)" stroke="#10b981" stroke-width="1.2">
        <animate attributeName="stroke" values="#10b981;#34d399;#10b981" dur="4s" repeatCount="indefinite" />
      </rect>
      <circle cx="22" cy="21" r="5" fill="#34d399" />
      <text x="36" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Ad-Free Clients</text>
      <text x="145" y="26" fill="#34d399" font-size="11" font-weight="500">SmartTube / Kodi</text>
    </g>

    <!-- Pill 4: Telemetry Stripping -->
    <g transform="translate(710, 0)">
      <rect width="200" height="42" rx="10" fill="url(#badgeGrad)" stroke="#f59e0b" stroke-width="1.2">
        <animate attributeName="stroke" values="#f59e0b;#fbbf24;#f59e0b" dur="4s" repeatCount="indefinite" />
      </rect>
      <circle cx="22" cy="21" r="5" fill="#fbbf24" />
      <text x="36" y="26" fill="#f1f5f9" font-size="13" font-weight="600">Zero Telemetry</text>
      <text x="140" y="26" fill="#fbbf24" font-size="11" font-weight="500">Hägezi Lists</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <line x1="300" y1="334" x2="900" y2="334" stroke="url(#titleGrad)" stroke-width="2" stroke-linecap="round" opacity="0.6">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite" />
  </line>
</svg>